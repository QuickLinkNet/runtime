<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17211d" />
    <title>RUNTIME – Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#edf5ef;background:#07100b;font:16px/1.5 system-ui,sans-serif}.panel{width:min(520px,100%);border:1px solid #33463a;border-top:4px solid #a8f536;border-radius:16px;padding:34px;background:#111b15;box-shadow:0 30px 90px #0008}.brand{font-size:34px;font-weight:900;letter-spacing:-.06em}.brand span{color:#a8f536}h1{margin:34px 0 8px;font-size:clamp(30px,8vw,52px);line-height:1}p{color:#aebbb3}button{margin-top:20px;border:0;border-radius:8px;padding:13px 18px;color:#10170f;background:#a8f536;font:800 14px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">RUNTIME<span>_</span></div>
      <h1>Verbindung verloren.</h1>
      <p>Die App ist installiert, aber ein Match braucht den RUNTIME-Server. Sobald du wieder online bist, kannst du genau hier weitermachen.</p>
      <button type="button" onclick="location.reload()">Erneut verbinden</button>
    </main>
  </body>
</html>
